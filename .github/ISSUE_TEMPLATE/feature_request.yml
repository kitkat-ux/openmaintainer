name: Feature request
description: Suggest a maintainer workflow improvement.
title: 'feature: '
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What repetitive maintainer work should improve? }
    validations: { required: true }
  - type: textarea
    id: workflow
    attributes: { label: Proposed workflow }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: usecase
    attributes: { label: Open-source maintainer use case }
